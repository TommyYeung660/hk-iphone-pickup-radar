name: Monitor stock and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-stock-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install monitor dependencies
        run: |
          python -m pip install -r agent/requirements.txt
          python -m playwright install chromium
      - name: Check Apple Store stock
        env:
          APPLE_BROWSER_CHANNEL: ""
        run: |
          python agent/check_once.py site/stock.json | tee /tmp/summary.txt
          AV=$(python3 -c "import json,sys; print(json.load(open('site/stock.json')).get('ok') and sum(int(t.get('available_count',0)) for t in json.load(open('site/stock.json'))['targets']))")
          echo "available=$AV" >> "$GITHUB_OUTPUT"
          if [ "$AV" != "0" ] && [ -n "$AV" ]; then
            echo "trigger=true" >> "$GITHUB_OUTPUT"
          fi
        id: stock
      - name: Dispatch checkout + Bark (stock hit)
        if: steps.stock.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_PAT }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/TommyYeung660/buyip18-checkout/dispatches \
            -d '{"event_type":"stock-hit","client_payload":{"profile":"billy01","dry_run":"","store":""}}'
          echo "已觸發下單 workflow（available=${{ steps.stock.outputs.available }}）"
          if [ -n "$BARK_URL" ]; then
            T=$(python3 -c "import urllib.parse;print(urllib.parse.quote('iPhone 18 有貨—自動下單已觸發'))")
            B=$(python3 -c "import urllib.parse;print(urllib.parse.quote('見雷達有貨，全鏈已派工'))")
            curl -sS "${BARK_URL%/}/$T/$B?group=iPhone18&level=timeSensitive&sound=alarm" || true
          else
            echo "（BARK_URL 未設，跳過推送）"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
