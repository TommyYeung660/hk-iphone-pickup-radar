name: Monitor stock and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-stock-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install monitor dependencies
        run: |
          python -m pip install -r agent/requirements.txt
          python -m playwright install chromium
      - name: Check Apple Store stock
        env:
          APPLE_BROWSER_CHANNEL: ""
        run: |
          python agent/check_once.py site/stock.json | tee /tmp/summary.txt
          AV=$(python3 -c "
          import json
          d = json.load(open('site/stock.json'))
          av = 0
          if d.get('ok') is True:
              av = sum(int(t.get('available_count', 0)) for t in d.get('targets', []))
          print(av)
          ")
          echo "available=$AV" >> "$GITHUB_OUTPUT"
          if [ "$AV" -gt 0 ]; then
            echo "trigger=true" >> "$GITHUB_OUTPUT"
          fi
        id: stock
      - name: Dispatch checkout + Bark (stock hit)
        if: steps.stock.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_PAT }}
          BARK_URL: ${{ secrets.BARK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          # 帶上命中的 SKU + 門市（結帳頁店搜尋按袋內商品匹配——必須精準打擊）
          # 9/19 用戶放寬：256GB+512GB 都買（布根地紅/冰川色 4 SKU）——
          # 1TB/2TB 仍然只記錄，不派工不響鈴
          HINT=$(python3 -c "
          import json
          BUY_ONLY = {'MJXQ4ZA/A', 'MJXR4ZA/A', 'MJXV4ZA/A', 'MJXW4ZA/A'}
          d = json.load(open('site/stock.json'))
          for t in d.get('targets', []):
              if t.get('available_count', 0) > 0 and t['sku'] in BUY_ONLY:
                  # 結帳頁靠顯示名稱（Apple {店名}）點選，必須送店名而非店號
                  st = [s['store_name'] for s in t.get('stores', []) if s.get('available')]
                  print(t['sku'] + ':' + (st[0] if st else ''))
                  break
          ")
          echo "命中: ${HINT:-（非 256/512GB SKU — 依政策不派工）}"
          if [ -z "$HINT" ]; then
            echo "命中非 256/512GB SKU — 政策跳過派工"
            exit 0
          fi
          SKU="${HINT%%:*}"; STORE="${HINT##*:}"
          # 共存防護：下單已在進行（掃描器或上輪派工）就不重複派工，避免 cancel 打斷活跑
          N=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/TommyYeung660/buyip18-checkout/actions/runs?status=in_progress&per_page=1" \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('total_count',0))")
          if [ "$N" != "0" ]; then
            echo "下單已在進行（$N）— 不重複派工"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/TommyYeung660/buyip18-checkout/dispatches \
            -d "{\"event_type\":\"stock-hit\",\"client_payload\":{\"profile\":\"billy01\",\"dry_run\":\"\",\"store\":\"$STORE\",\"sku\":\"$SKU\"}}"
          echo "已觸發下單 workflow（available=${{ steps.stock.outputs.available }}）"
          if [ -n "$BARK_URL" ]; then
            T=$(python3 -c "import urllib.parse;print(urllib.parse.quote('iPhone 18 有貨—自動下單已觸發'))")
            B=$(python3 -c "import urllib.parse;print(urllib.parse.quote('見雷達有貨，全鏈已派工'))")
            curl -sS "${BARK_URL%/}/$T/$B?group=iPhone18&level=timeSensitive&sound=alarm" || true
          else
            echo "（BARK_URL 未設，跳過推送）"
          fi
          if [ -n "$PUSHOVER_TOKEN" ] && [ -n "$PUSHOVER_USER" ]; then
            curl -s -X POST https://api.pushover.net/1/messages.json \
              -d "token=$PUSHOVER_TOKEN" -d "user=$PUSHOVER_USER" \
              -d "title=iPhone 18 有貨—自動下單已觸發" \
              --data-urlencode "message=見雷達有貨（SKU=$SKU），全鏈已派工" \
              -d "priority=2" -d "sound=siren" -d "retry=30" -d "expire=10800" || true
          else
            echo "（PUSHOVER 未設，跳過推送）"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
